[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "echo-hemodynamic-engine"
version = "2.0.1"
description = "Echocardiographic hemodynamic calculations and an optional audit API"
readme = "README.md"
authors = [{ name = "Dr. Abu Suraih Sakhri" }]
license = { text = "MIT" }
classifiers = [
    "Programming Language :: Python :: 3",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]
requires-python = ">=3.9"
dependencies = ["pydantic>=2,<3"]

[project.optional-dependencies]
api = ["fastapi>=0.111,<1", "uvicorn>=0.30,<1"]
test = ["pytest>=8,<10", "httpx>=0.27,<1"]

[project.scripts]
echo-hemodynamic-engine = "echo_hemodynamic_agent.cli:main"
echo-hemodynamics = "cli:main"

[project.urls]
Homepage = "https://github.com/abusuraihsakhri/echo-hemodynamic-agent"
Repository = "https://github.com/abusuraihsakhri/echo-hemodynamic-agent.git"

[tool.setuptools]
py-modules = ["echo_hemodynamics", "cli", "enrichment", "simulator"]

[tool.setuptools.packages.find]
include = ["agents", "echo_hemodynamic_agent", "web"]

[tool.setuptools.package-data]
web = ["*.html", "*.js"]
