name: Echo Hemodynamic Engine CI

on:
  push:
    branches: [ master, main ]
  pull_request:
    branches: [ master, main ]

jobs:
  test-and-audit:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.10", "3.11", "3.12"]

    steps:
    - uses: actions/checkout@v4

    - name: Set up Python ${{ matrix.python-version }}
      uses: actions/setup-python@v5
      with:
        python-version: ${{ matrix.python-version }}

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -e ".[api,test]" build

    - name: Package wheel and check installation
      run: |
        python -m build --wheel
        python -m pip check
        python -m compileall -q agents echo_hemodynamic_agent echo_hemodynamics.py cli.py

    - name: Run Pytest Suite
      run: |
        pytest -v

    - name: Browser arithmetic tests
      run: node --test tests/test_browser_calculator.cjs

    - name: Security SAST & Zero-PHI Audit
      run: |
        python -c "
        from agents.base import PHIGuard, AuditLogger
        import pytest
        assert AuditLogger.verify_integrity() is True
        print('Security & Zero-PHI Audit Passed!')
        "
